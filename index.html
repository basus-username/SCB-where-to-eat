<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>YouVote</title>
<meta name="description" content="Quick group polls — dates, places, anything." />

<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#141319" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="YouVote" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="icon" href="/icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141319;
    --surface:#1E1C27;
    --surface-2:#2E2A3D;
    --border:#4E4768;
    --text:#F5F3FA;
    --text-muted:#A39DB8;
    --violet:#A594F5;
    --violet-dim:#332C4D;
    --violet-tint:#251F38;
    --gold:#EFB65C;
    --gold-dim:#4A3820;
    --rose:#E88989;
    --rose-dim:#4A2A2A;
    --green:#7FCB98;
    --radius:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  .num{font-family:'JetBrains Mono',monospace;font-weight:700;font-variant-numeric:tabular-nums;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;font-weight:600;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}
  ::selection{background:var(--violet-dim);}

  #app{max-width:560px;margin:0 auto;padding:20px 16px 40px;}

  /* ---------- permanent undo fab ----------
     Lives bottom-right, floating above content, so it never competes with
     the topbar (brand name, voter chip) for space. It's a single tappable
     pill — icon + label together — so there's no hover-only tooltip that's
     unusable on a touchscreen. */
  .undo-fab{
    position:fixed;bottom:18px;right:16px;z-index:80;
    display:flex;align-items:center;gap:8px;
    border:1px solid var(--gold);background:var(--gold-dim);color:var(--gold);
    border-radius:24px;padding:8px 14px 8px 8px;font-size:12.5px;font-weight:600;
    box-shadow:0 4px 16px rgba(0,0,0,0.4);
    opacity:0;transform:translateY(8px) scale(0.96);pointer-events:none;
    transition:opacity .18s,transform .18s;
  }
  .undo-fab.active{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  .undo-fab:active{transform:scale(0.95);}
  .undo-fab-icon{
    width:26px;height:26px;border-radius:50%;background:rgba(239,182,92,0.18);
    display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;
  }
  .undo-fab-text{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 2px 22px;
  }
  .brand{display:flex;align-items:center;gap:9px;text-decoration:none;}
  .brand-mark{
    width:30px;height:30px;border-radius:8px;
    background:linear-gradient(155deg,#8A6BF0,#D162C9 55%,#FFB648);
    display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;
  }
  .brand-name{font-family:'Fraunces',serif;font-weight:600;font-size:17px;letter-spacing:0.2px;line-height:1.15;}
  .credit{font-size:10px;color:var(--text-muted);letter-spacing:.3px;margin-top:1px;}
  .voter-chip{
    display:flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:20px;padding:5px 10px 5px 6px;font-size:12.5px;color:var(--text-muted);
  }
  .voter-avatar{
    width:20px;height:20px;border-radius:50%;background:var(--violet);
    color:var(--bg);font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;
  }

  /* ---------- Home ---------- */
  .hero{margin-bottom:18px;}
  .hero h1{font-size:19px;line-height:1.25;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hero p{color:var(--text-muted);font-size:13.5px;line-height:1.4;margin:0;}

  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px;margin-bottom:12px;
  }
  .field-label{font-size:12.5px;color:var(--text);margin-bottom:4px;display:block;font-weight:700;}
  .field-label-sub{font-size:11px;color:var(--violet);font-weight:400;margin:0 0 8px;display:block;line-height:1.35;}
  .field{
    width:100%;background:var(--surface-2);border:1.5px solid var(--border);
    border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:15px;
    margin-bottom:14px;outline:none;transition:border-color .15s,box-shadow .15s;
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.25);
  }
  .field::placeholder{color:var(--text-muted);font-size:12.5px;}
  .field:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(165,148,245,0.25);}
  textarea.field{resize:vertical;min-height:60px;}

  .btn{
    border:none;border-radius:var(--radius-sm);padding:12px 18px;font-size:14.5px;font-weight:600;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s,opacity .15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--violet);color:#fff;width:100%;}
  .btn-primary:disabled{opacity:0.5;}
  .btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border);}
  .btn-sm{padding:8px 12px;font-size:13px;}

  /* compact action chips — smaller, secondary-feeling */
  .chip-row{display:flex;gap:7px;flex-wrap:wrap;position:relative;}
  .chip{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    font-size:12px;font-weight:600;padding:6px 11px;border-radius:16px;
    display:inline-flex;align-items:center;gap:5px;
  }
  .chip:active{background:var(--violet-dim);}
  .chip-icon-only{padding:6px 10px;}

  .recent-list{display:flex;flex-direction:column;gap:8px;}
  .swipe-wrap{position:relative;border-radius:var(--radius-sm);overflow:hidden;}
  .swipe-delete{
    position:absolute;top:0;right:0;bottom:0;width:76px;border:none;
    background:var(--rose);color:#2a1010;font-size:19px;
    display:flex;align-items:center;justify-content:center;
  }
  .recent-item{
    position:relative;display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:13px 15px;text-decoration:none;color:var(--text);
    touch-action:pan-y;will-change:transform;
  }
  .recent-item-title{font-weight:600;font-size:14.5px;}
  .recent-item-meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .chevron{color:var(--text-muted);}
  .swipe-hint{font-size:11px;color:var(--text-muted);text-align:center;margin:2px 0 4px;opacity:.75;}

  .section-label{
    font-size:11.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-muted);
    font-weight:700;margin:26px 0 10px;
  }

  /* ---------- Poll view ---------- */
  .poll-header{margin-bottom:18px;}
  .poll-title{font-size:24px;margin:0 0 6px;}
  .poll-meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-muted);flex-wrap:wrap;}
  .status-pill{
    padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  }
  .status-open{background:rgba(140,122,230,0.18);color:var(--violet);}
  .status-closed{background:rgba(217,118,118,0.18);color:var(--rose);}
  .icon-btn{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    font-size:13px;font-weight:600;padding:6px 10px;border-radius:20px;
    display:inline-flex;align-items:center;gap:5px;
  }
  .icon-btn:active{background:var(--violet-dim);}

  .menu-popover{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
    margin-top:8px;overflow:hidden;
  }
  .menu-item{
    width:100%;text-align:left;background:transparent;border:none;color:var(--text);
    padding:12px 14px;font-size:13.5px;font-weight:600;border-bottom:1px solid var(--border);
  }
  .menu-item:last-child{border-bottom:none;}
  .menu-item:active{background:var(--surface-2);}

  /* ---------- option cards ---------- */
  .option-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:10px;overflow:hidden;
  }
  .option-row{position:relative;cursor:pointer;}
  .option-row:focus-visible{outline:2px solid var(--violet);outline-offset:-2px;}
  .opt-progress-bg{position:absolute;left:0;top:0;bottom:0;opacity:0.55;transition:width .3s ease;}
  .opt-row-content{position:relative;display:flex;align-items:center;gap:9px;padding:12px 11px;z-index:1;}
  .opt-row-text{flex:1;min-width:0;}
  .opt-title{
    font-weight:600;font-size:14.5px;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .opt-count{font-size:12.5px;color:var(--text-muted);flex-shrink:0;}
  .opt-chevron{
    flex-shrink:0;color:var(--text-muted);font-size:13px;transition:transform .15s,background .15s;
    width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);border:1px solid var(--border);padding:0;
  }
  .opt-chevron:active{background:var(--violet-dim);}
  .opt-chevron.open{transform:rotate(180deg);}
  .vote-btn{
    min-width:46px;height:30px;border-radius:9px;border:1.5px solid var(--border);
    background:var(--bg);color:var(--text-muted);
    flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:2px;
    font-size:10px;font-weight:800;letter-spacing:.1px;text-transform:uppercase;padding:0 6px;
    transition:background .15s,border-color .15s,color .15s;
  }
  .vote-btn.checked{background:var(--green);border-color:var(--green);color:#0d1a10;}
  .option-detail{padding:0 14px 14px;border-top:1px solid var(--border);}
  .option-notes{font-size:13px;color:var(--text-muted);line-height:1.4;padding-top:10px;}
  .option-sub{margin-top:8px;}
  .link-chip{
    color:var(--violet);text-decoration:none;font-weight:600;
    background:rgba(140,122,230,0.12);border:1px solid var(--violet-dim);
    padding:3px 9px;border-radius:20px;font-size:11.5px;
  }
  .option-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px;}
  .voter-tokens{display:flex;flex-wrap:wrap;gap:5px;flex:1;align-items:center;}
  .voter-token{
    width:24px;height:24px;border-radius:50%;background:var(--violet-dim);border:1px solid var(--violet);
    color:var(--text);font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;
  }
  .vote-count-label{font-size:11.5px;color:var(--text-muted);}

  /* swipe-to-delete for poll option rows — same mechanics as home list */
  .swipe-wrap-option{position:relative;border-radius:var(--radius);overflow:hidden;margin-bottom:10px;}
  .swipe-wrap-option .option-card{margin-bottom:0;touch-action:pan-y;will-change:transform;}
  .swipe-delete-option{
    position:absolute;top:0;right:0;bottom:0;width:76px;border:none;
    background:var(--rose);color:#2a1010;font-size:19px;
    display:flex;align-items:center;justify-content:center;
  }

  /* ---------- collapsible "add option" control ---------- */
  .add-toggle-btn{
    width:100%;background:var(--violet-tint);border:1.5px dashed var(--violet);color:var(--violet);
    border-radius:var(--radius);padding:12px;font-size:14px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:10px;
  }
  .add-toggle-btn:active{background:var(--violet-dim);}
  .add-option-card{background:var(--violet-tint);border:1.5px solid var(--violet);}
  .add-option-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .add-option-head h3{margin:0;font-size:14px;font-family:'Inter',sans-serif;font-weight:700;color:var(--violet);}
  .add-collapse-btn{background:transparent;border:none;color:var(--text-muted);font-size:12.5px;font-weight:600;padding:4px;}
  .add-option-card .field{background:var(--surface-2);border-color:var(--violet-dim);}
  .autofill-row{display:flex;gap:6px;align-items:stretch;}
  .autofill-row .field{margin-bottom:0;flex:1;min-width:0;}
  .btn-secondary{background:var(--surface-2);color:var(--violet);border:1px solid var(--violet-dim);}
  .link-clear-btn{
    flex-shrink:0;width:40px;background:var(--surface-2);border:1.5px solid var(--border);
    color:var(--text-muted);border-radius:var(--radius-sm);font-size:14px;padding:0;
  }
  .link-clear-btn:active{background:var(--violet-dim);color:var(--text);}
  .autofill-status{
    font-size:12px;color:var(--text-muted);margin:8px 0 0;min-height:16px;
    overflow-wrap:anywhere;word-break:break-word;white-space:normal;line-height:1.4;
  }

  .tab-row{display:flex;gap:8px;margin-bottom:14px;}
  .tab-btn{
    flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);
    padding:9px;border-radius:10px;font-size:12.5px;font-weight:700;
  }
  .tab-btn.active{background:var(--violet);border-color:var(--violet);color:#fff;}

  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-month{font-weight:700;font-size:13.5px;}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;color:var(--text-muted);font-size:10.5px;text-align:center;margin-bottom:6px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px;}
  .cal-cell{
    aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-size:12.5px;font-weight:600;padding:0;
  }
  .cal-cell.empty{background:transparent;border:none;}
  .cal-cell.past{opacity:0.3;}
  .cal-cell.selected{background:var(--violet);border-color:var(--violet);color:#fff;}

  .empty-state{
    text-align:center;color:var(--text-muted);font-size:13.5px;padding:30px 10px;
  }

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px;
  }
  .modal{
    background:var(--surface);border:1px solid var(--border);border-radius:20px;
    padding:22px 20px 24px;width:100%;max-width:420px;position:relative;
    max-height:82vh;overflow-y:auto;
  }
  .modal h3{margin:0 0 6px;padding-right:26px;}
  .modal p{color:var(--text-muted);font-size:13.5px;margin:0 0 16px;}
  .modal-close{
    position:absolute;top:16px;right:16px;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text-muted);width:28px;height:28px;border-radius:50%;font-size:14px;
    display:flex;align-items:center;justify-content:center;padding:0;
  }

  .toast{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:10px 16px;border-radius:20px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .toast.show{opacity:1;}

  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>
<button id="undo-fab" class="undo-fab" aria-label="Undo last delete">
  <span class="undo-fab-icon">↺</span><span class="undo-fab-text" id="undo-fab-text"></span>
</button>
<div id="app"><div class="empty-state">Loading…</div></div>
<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, deleteField,
  collection, addDoc, onSnapshot, serverTimestamp, query, orderBy, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================================================
   1) FIREBASE SETUP — same project as before, reused as-is.
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyA720BwK67-xktnUovId2Gh2wgrbafGVjk",
  authDomain: "scb-poll-votes-ee57c.firebaseapp.com",
  projectId: "scb-poll-votes-ee57c",
  storageBucket: "scb-poll-votes-ee57c.firebasestorage.app",
  messagingSenderId: "817191277697",
  appId: "1:817191277697:web:2e6d691f16fb9425cf6980"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

/* ---------- helpers ---------- */
const $app = document.getElementById('app');
const $toast = document.getElementById('toast');
function toast(msg){
  $toast.textContent = msg;
  $toast.classList.add('show');
  setTimeout(()=>$toast.classList.remove('show'), 2200);
}
/* ---------- modal helpers: back button closes the modal, not the app ---------- */
function openModal(backdrop){
  document.body.appendChild(backdrop);
  history.pushState({ modal: true }, '');
  const modal = backdrop.querySelector('.modal');
  if (modal && !modal.querySelector('.modal-close')) {
    const x = document.createElement('button');
    x.className = 'modal-close';
    x.setAttribute('aria-label', 'Close');
    x.textContent = '✕';
    x.addEventListener('click', () => closeModal(backdrop));
    modal.prepend(x);
  }
}
function closeModal(backdrop){
  if (!backdrop.isConnected) return;
  backdrop.remove();
  if (history.state && history.state.modal) history.back();
}
window.addEventListener('popstate', () => {
  document.querySelectorAll('.modal-backdrop').forEach(b => b.remove());
});

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function initialsOf(name){
  return name.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase();
}
function genId(len=7){
  return Array.from(crypto.getRandomValues(new Uint8Array(len)))
    .map(b => (b % 36).toString(36)).join('');
}
/* ---------- title-based poll id, so the share link reads like the poll ----------
   e.g. "Weekend hike?" -> weekend-hike-a8f3k. Keeps the link readable in
   WhatsApp previews without needing a custom domain/subdomain per poll. */
function slugify(s){
  return (s || '')
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 40);
}
function genPollId(title){
  const slug = slugify(title);
  return slug ? `${slug}-${genId(5)}` : genId(8);
}
const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function formatDateOption(iso){
  const d = new Date(iso + 'T00:00:00');
  return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${WEEKDAYS[d.getDay()]}`;
}
/* ---------- auto-close time formatting ----------
   closeAt is stored as a plain ISO datetime string (from a
   <input type="datetime-local">), evaluated in the voter's local time. */
function formatDateTime(iso){
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const h24 = d.getHours();
  const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
  const min = String(d.getMinutes()).padStart(2, '0');
  const ampm = h24 < 12 ? 'AM' : 'PM';
  return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${h12}:${min} ${ampm}`;
}
/* input[type=datetime-local] needs "YYYY-MM-DDTHH:MM" in local time */
function toDatetimeLocalValue(iso){
  const d = iso ? new Date(iso) : new Date(Date.now() + 60 * 60 * 1000);
  if (isNaN(d.getTime())) return '';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ---------- brand mark (inline SVG so it matches the app icon) ---------- */
const BRAND_ICON_SVG = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none"><rect x="2" y="7" width="20" height="10" rx="5" stroke="#fff" stroke-width="2"/><path d="M8.5 12l2 2 4.5-4.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ---------- per-person colour, consistent across every poll on this device ---------- */
const PERSON_COLORS = ['#A594F5','#EFB65C','#7FCB98','#E88989','#6FB8E0','#E0A5D8','#C9CE6B','#E39B6B','#8FD0C4','#B8A0F0'];
function getPersonColor(voterId){
  let map = {};
  try { map = JSON.parse(localStorage.getItem('poll_person_colors') || '{}'); } catch {}
  if (map[voterId] === undefined) {
    const used = Object.values(map);
    map[voterId] = used.length % PERSON_COLORS.length;
    localStorage.setItem('poll_person_colors', JSON.stringify(map));
  }
  return PERSON_COLORS[map[voterId]];
}

/* ---------- voter identity (per device) ----------
   Identity is a permanent random id, separate from the display name, so
   renaming never creates a "new" voter or duplicates their votes. */
function getVoter(){
  const raw = localStorage.getItem('poll_voter');
  return raw ? JSON.parse(raw) : null;
}
function getOrCreateVoterId(){
  let id = localStorage.getItem('poll_voter_id');
  if (!id) { id = genId(10); localStorage.setItem('poll_voter_id', id); }
  return id;
}
function setVoter(name){
  const v = { id: getOrCreateVoterId(), name: name.trim(), initials: initialsOf(name) };
  localStorage.setItem('poll_voter', JSON.stringify(v));
  return v;
}

/* ---------- recent polls (per device) ---------- */
function getRecents(){
  try { return JSON.parse(localStorage.getItem('poll_recents') || '[]'); } catch { return []; }
}
function addRecent(id, title){
  const list = getRecents().filter(p => p.id !== id);
  list.unshift({ id, title, ts: Date.now() });
  localStorage.setItem('poll_recents', JSON.stringify(list.slice(0, 12)));
}
function removeRecent(id){
  const list = getRecents().filter(p => p.id !== id);
  localStorage.setItem('poll_recents', JSON.stringify(list));
}

/* ---------- permanent undo fab (works for option-delete and poll-delete) ----------
   Lives entirely in this browser tab's memory, so it only ever undoes an
   action that this same person just took here — nobody else can trigger it. */
let pendingUndo = null;
const $undoFab = document.getElementById('undo-fab');
const $undoFabText = document.getElementById('undo-fab-text');
function showUndoBanner(message, restoreFn){
  pendingUndo = { restore: restoreFn };
  $undoFabText.textContent = message;
  $undoFab.setAttribute('aria-label', `Undo: ${message}`);
  $undoFab.classList.add('active');
}
function hideUndoBanner(){
  pendingUndo = null;
  $undoFab.classList.remove('active');
}
$undoFab.addEventListener('click', async () => {
  if (!pendingUndo) return;
  const restore = pendingUndo.restore;
  hideUndoBanner();
  try { await restore(); toast('Restored'); }
  catch (e) { toast(`Could not restore: ${e.message || 'unknown error'}`); console.error(e); }
});

/* ---------- generic swipe-to-delete (used by home list and poll options) ---------- */
function bindSwipeToDelete(wrapSelector, rowSelector, delBtnAttr, onDelete){
  const OPEN = -76;
  document.querySelectorAll(wrapSelector).forEach(wrap => {
    const row = wrap.querySelector(rowSelector);
    const delBtn = wrap.querySelector(`[${delBtnAttr}]`);
    if (!row) return;
    let startX = 0, startTranslate = 0, current = 0, dragging = false, moved = false, suppressClick = false;

    row.addEventListener('pointerdown', (e) => {
      startX = e.clientX;
      startTranslate = current;
      dragging = true;
      moved = false;
      row.style.transition = 'none';
      row.setPointerCapture?.(e.pointerId);
    });
    row.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 6) moved = true;
      current = Math.max(OPEN, Math.min(0, startTranslate + dx));
      row.style.transform = `translateX(${current}px)`;
    });
    const finish = () => {
      if (!dragging) return;
      dragging = false;
      row.style.transition = 'transform .18s ease';
      if (!moved) {
        // a tap, not a drag: if the row was already open, this tap should
        // just close it — never let the click that follows also navigate,
        // and never let a child's own click handler (e.g. expand-on-tap) fire.
        if (startTranslate === OPEN) {
          current = 0;
          row.style.transform = 'translateX(0)';
          suppressClick = true;
          wrap.dataset.justDragged = '1';
        }
        return;
      }
      current = current < OPEN / 2 ? OPEN : 0;
      row.style.transform = `translateX(${current}px)`;
      suppressClick = true; // a real drag should never also fire navigation
      wrap.dataset.justDragged = '1';
    };
    row.addEventListener('pointerup', finish);
    row.addEventListener('pointercancel', finish);
    row.addEventListener('click', (e) => {
      if (suppressClick) {
        e.preventDefault();
        suppressClick = false;
      }
    });

    delBtn?.addEventListener('click', () => onDelete(delBtn));
  });
}

/* ---------- swipe-to-delete on home rows ---------- */
function initSwipeToDelete(){
  bindSwipeToDelete('.swipe-wrap', '.recent-item', 'data-swipe-delete', (delBtn) => {
    const id = delBtn.getAttribute('data-swipe-delete');
    const title = delBtn.getAttribute('data-swipe-title');
    openDeletePollModal(id, title);
  });
}

/* =========================================================
   POLL VIEW
   ========================================================= */
function renderPollView(id){
  $app.innerHTML = `<div class="empty-state">Loading poll…</div>`;

  const pollRef = doc(db, 'polls', id);
  const optionsRef = query(collection(db, 'polls', id, 'options'), orderBy('createdAt', 'asc'));

  let pollData = null;
  let options = [];
  let menuOpen = false;
  let addTab = 'text';
  let addExpanded = false;
  let namePrompted = false;
  const expandedIds = new Set();
  const calState = { month: new Date(new Date().getFullYear(), new Date().getMonth(), 1), selected: new Set() };

  onSnapshot(pollRef, (snap) => {
    if (!snap.exists()) {
      $app.innerHTML = `<div class="empty-state">This poll doesn't exist or was removed.<br><br><a href="?" class="btn btn-ghost">Back home</a></div>`;
      return;
    }
    pollData = snap.data();
    addRecent(id, pollData.title);
    draw();
    // ask who's voting as soon as they land on a poll, not on their first tap
    if (!namePrompted && !getVoter()) {
      namePrompted = true;
      askVoterName(() => draw());
    }
  }, (err) => {
    $app.innerHTML = `<div class="empty-state">Couldn't load poll — check your Firebase config in index.html.</div>`;
    console.error(err);
  });

  onSnapshot(optionsRef, (snap) => {
    options = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    draw();
  });

  function draw(){
    if (!pollData) return;
    checkAutoClose();
    const voter = getVoter();
    // options stay in creation order — never re-sorted by vote count, so
    // rows don't jump around as people vote. "Leading" is still highlighted.
    const topCount = options.length ? Math.max(...options.map(voteCount)) : 0;
    const totalVotes = options.reduce((sum, o) => sum + voteCount(o), 0);

    $app.innerHTML = `
      <div class="topbar">
        <a href="?" class="brand">
          <div class="brand-mark">${BRAND_ICON_SVG}</div>
          <div>
            <div class="brand-name">YouVote</div>
            <div class="credit">By YE Chew</div>
          </div>
        </a>
        ${voter ? `
          <div class="voter-chip" id="voter-chip">
            <div class="voter-avatar" style="background:${getPersonColor(voter.id)};">${escapeHtml(voter.initials)}</div>
            ${escapeHtml(voter.name)}
          </div>
        ` : `<button class="btn btn-ghost btn-sm" id="set-voter-btn">Set your name</button>`}
      </div>

      <div class="poll-header">
        <div style="display:flex;align-items:center;gap:8px;">
          <h1 class="poll-title" style="flex:1;">${escapeHtml(pollData.title)}</h1>
          <button class="icon-btn" id="edit-title-btn" title="Edit poll title">✏️</button>
        </div>
        <div class="poll-meta">
          <span class="status-pill ${pollData.closed ? 'status-closed' : 'status-open'}">
            ${pollData.closed ? 'Closed' : 'Voting open'}
          </span>
          <span>·</span>
          <span>${options.length} option${options.length===1?'':'s'}</span>
          ${!pollData.closed && pollData.closeAt ? `<span>·</span><span>Auto-closes ${formatDateTime(pollData.closeAt)}</span>` : ''}
        </div>
        <div class="chip-row" style="margin-top:10px;">
          <button class="chip" id="toggle-multi-btn" title="Switch between single and multiple choice">
            ${pollData.multiChoice ? '☑️ Multiple' : '⚪ Single'}
          </button>
          <button class="chip" id="share-btn" title="Copy share link">🔗 Share</button>
          <button class="chip chip-icon-only" id="more-menu-btn" title="More options">⋯</button>
        </div>
        ${menuOpen ? `
          <div class="menu-popover" id="more-menu">
            <button class="menu-item" id="toggle-close-btn">${pollData.closed ? '↺ Reopen voting' : '🔒 Close voting'}</button>
            <button class="menu-item" id="schedule-close-btn">${pollData.closeAt ? '⏰ Change auto-close time' : '⏰ Auto-close at a set time'}</button>
            <button class="menu-item" id="copy-results-btn">📋 Copy results</button>
          </div>
        ` : ''}
      </div>

      ${!pollData.closed ? (addExpanded
          ? addOptionCardHtml(addTab, calState)
          : `<button class="add-toggle-btn" id="add-toggle-btn">＋ Add an option</button>`
        ) : ''}

      ${options.length === 0 ? `<div class="empty-state">No options yet — add the first one above.</div>` : ''}

      ${options.length ? `<div class="swipe-hint">Swipe an option left to delete</div>` : ''}
      ${options.map(opt => `
        <div class="swipe-wrap-option">
          <button class="swipe-delete-option" data-swipe-delete-option="${opt.id}" aria-label="Delete option">🗑️</button>
          ${optionCardHtml(opt, voter, totalVotes, voteCount(opt)===topCount && topCount>0, expandedIds.has(opt.id))}
        </div>
      `).join('')}
    `;

    bindPollEvents(id, pollData, options, voter);
  }

  function bindPollEvents(pollId, pollData, options, voter){
    const setVoterBtn = document.getElementById('set-voter-btn');
    const voterChip = document.getElementById('voter-chip');
    if (setVoterBtn) setVoterBtn.addEventListener('click', () => askVoterName(() => draw()));
    if (voterChip) voterChip.addEventListener('click', () => askVoterName(async (v) => {
      // renaming relabels this person's existing votes in this poll — it
      // never creates a duplicate voter or changes what they voted for.
      const toUpdate = options.filter(o => o.votes && o.votes[v.id]);
      await Promise.all(toUpdate.map(o => updateDoc(doc(db, 'polls', pollId, 'options', o.id), {
        [`votes.${v.id}.name`]: v.name,
        [`votes.${v.id}.initials`]: v.initials
      })));
      draw();
    }));

    document.getElementById('add-toggle-btn')?.addEventListener('click', () => {
      addExpanded = true;
      draw();
    });
    document.getElementById('add-collapse-btn')?.addEventListener('click', () => {
      addExpanded = false;
      draw();
    });

    document.getElementById('share-btn')?.addEventListener('click', () => {
      navigator.clipboard?.writeText(location.href);
      toast('Link copied — send it to the group!');
    });

    document.getElementById('toggle-close-btn')?.addEventListener('click', async () => {
      try {
        await updateDoc(doc(db, 'polls', pollId), { closed: !pollData.closed });
        menuOpen = false;
      } catch (e) {
        toast(`Could not update poll status: ${e.message || 'unknown error'}`);
        console.error(e);
      }
    });

    document.getElementById('schedule-close-btn')?.addEventListener('click', () => {
      menuOpen = false;
      draw();
      openScheduleCloseModal(pollId, pollData.closeAt);
    });

    document.getElementById('copy-results-btn')?.addEventListener('click', () => {
      menuOpen = false;
      draw();
      copyResultsAsImage(pollData, options);
    });

    document.getElementById('toggle-multi-btn')?.addEventListener('click', async () => {
      try {
        await updateDoc(doc(db, 'polls', pollId), { multiChoice: !pollData.multiChoice });
        toast(pollData.multiChoice ? 'Switched to single choice' : 'Switched to multiple choice');
      } catch (e) {
        toast(`Could not switch voting mode: ${e.message || 'unknown error'}`);
        console.error(e);
      }
    });

    document.getElementById('edit-title-btn')?.addEventListener('click', () => openEditTitleModal(pollId, pollData.title));

    document.getElementById('more-menu-btn')?.addEventListener('click', () => {
      menuOpen = !menuOpen;
      draw();
    });

    // Tapping anywhere on an option row votes for it. Only the chevron
    // button (below, with its own stopPropagation) expands/collapses.
    document.querySelectorAll('[data-vote-row]').forEach(row => {
      const fireVote = () => {
        const wrap = row.closest('.swipe-wrap-option');
        if (wrap && wrap.dataset.justDragged === '1') { wrap.dataset.justDragged = ''; return; }
        const optId = row.getAttribute('data-vote-row');
        const v = getVoter();
        if (!v) { askVoterName(() => castVote(pollId, options, optId, pollData.multiChoice)); return; }
        castVote(pollId, options, optId, pollData.multiChoice);
      };
      row.addEventListener('click', fireVote);
      row.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fireVote(); }
      });
    });

    document.querySelectorAll('[data-toggle-expand]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const wrap = btn.closest('.swipe-wrap-option');
        if (wrap && wrap.dataset.justDragged === '1') { wrap.dataset.justDragged = ''; return; }
        const optId = btn.getAttribute('data-toggle-expand');
        if (expandedIds.has(optId)) expandedIds.delete(optId); else expandedIds.add(optId);
        draw();
      });
    });

    document.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const optId = btn.getAttribute('data-edit');
        const opt = options.find(o => o.id === optId);
        openEditModal(pollId, opt);
      });
    });

    document.querySelectorAll('[data-delete-option]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const optId = btn.getAttribute('data-delete-option');
        const opt = options.find(o => o.id === optId);
        openDeleteOptionModal(pollId, opt);
      });
    });

    bindSwipeToDelete('.swipe-wrap-option', '.option-card', 'data-swipe-delete-option', (delBtn) => {
      const optId = delBtn.getAttribute('data-swipe-delete-option');
      const opt = options.find(o => o.id === optId);
      if (opt) openDeleteOptionModal(pollId, opt);
    });

    document.querySelectorAll('[data-add-tab]').forEach(btn => {
      btn.addEventListener('click', () => { addTab = btn.getAttribute('data-add-tab'); draw(); });
    });

    if (addTab === 'text') {
      document.getElementById('add-option-btn')?.addEventListener('click', () => addOption(pollId));
      const linkInput = document.getElementById('opt-link');
      document.getElementById('resolve-btn')?.addEventListener('click', () => pasteAndResolve());
      document.getElementById('clear-link-btn')?.addEventListener('click', () => {
        linkInput.value = '';
        linkInput.focus();
        document.getElementById('resolve-status').textContent = '';
      });
      linkInput?.addEventListener('paste', () => setTimeout(resolveLink, 50));
    } else {
      document.getElementById('cal-prev')?.addEventListener('click', () => {
        calState.month = new Date(calState.month.getFullYear(), calState.month.getMonth() - 1, 1);
        draw();
      });
      document.getElementById('cal-next')?.addEventListener('click', () => {
        calState.month = new Date(calState.month.getFullYear(), calState.month.getMonth() + 1, 1);
        draw();
      });
      document.querySelectorAll('[data-cal-day]').forEach(btn => {
        btn.addEventListener('click', () => {
          const iso = btn.getAttribute('data-cal-day');
          if (calState.selected.has(iso)) calState.selected.delete(iso); else calState.selected.add(iso);
          draw();
        });
      });
      document.getElementById('add-dates-btn')?.addEventListener('click', () => addDateOptions(pollId, calState, () => draw()));
    }
  }

  async function resolveLink(){
    const link = document.getElementById('opt-link').value.trim();
    const statusEl = document.getElementById('resolve-status');
    if (!link) { statusEl.textContent = 'Paste a link first.'; return; }
    statusEl.textContent = 'Reading link…';
    try {
      const res = await fetch(`/api/resolve-link?url=${encodeURIComponent(link)}`);
      const data = await res.json();
      if (!res.ok || !data.name) {
        statusEl.textContent = data.error || "Couldn't read a name from that link — type it in below.";
        return;
      }
      document.getElementById('opt-name').value = data.name;
      if (data.resolvedUrl) document.getElementById('opt-link').value = data.resolvedUrl;
      statusEl.textContent = `Found: ${data.name}`;
    } catch (e) {
      statusEl.textContent = `Couldn't read that link (${e.message || 'network error'}) — type the name in below.`;
      console.error(e);
    }
  }

  async function pasteAndResolve(){
    const input = document.getElementById('opt-link');
    const statusEl = document.getElementById('resolve-status');
    try {
      const clip = await navigator.clipboard.readText();
      if (clip && clip.trim()) {
        input.value = clip.trim();
      } else if (!input.value.trim()) {
        statusEl.textContent = 'Clipboard is empty — copy the link first, then tap this.';
        return;
      }
    } catch (e) {
      if (!input.value.trim()) {
        statusEl.textContent = "Couldn't read clipboard — paste the link into the field above, then tap this.";
        input.focus();
        return;
      }
    }
    resolveLink();
  }

  async function addOption(pollId){
    const name = document.getElementById('opt-name').value.trim();
    const link = document.getElementById('opt-link').value.trim();
    const notes = document.getElementById('opt-notes').value.trim();
    if (!name) { document.getElementById('opt-name').focus(); return; }

    const btn = document.getElementById('add-option-btn');
    btn.disabled = true; btn.textContent = 'Adding…';
    try {
      await addDoc(collection(db, 'polls', pollId, 'options'), {
        name, notes,
        link: link || null,
        isDate: false,
        votes: {},
        createdAt: serverTimestamp()
      });
      toast('Added to the poll');
      addExpanded = false;
      draw();
    } catch(e){
      toast(`Could not add option: ${e.message || 'unknown error'}`);
      console.error(e);
    } finally {
      btn.disabled = false; btn.textContent = 'Add to poll';
    }
  }

  async function addDateOptions(pollId, calState, onDone){
    const dates = Array.from(calState.selected).sort();
    if (!dates.length) return;
    const btn = document.getElementById('add-dates-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Adding…'; }
    try {
      await Promise.all(dates.map(iso => addDoc(collection(db, 'polls', pollId, 'options'), {
        name: formatDateOption(iso),
        notes: '', link: null, isDate: true, dateISO: iso,
        votes: {}, createdAt: serverTimestamp()
      })));
      calState.selected.clear();
      toast(`Added ${dates.length} date${dates.length===1?'':'s'}`);
      addExpanded = false;
    } catch (e) {
      toast(`Could not add dates: ${e.message || 'unknown error'}`);
      console.error(e);
    } finally {
      if (onDone) onDone();
    }
  }

  /* ---------- delete option modal (with undo) ---------- */
  function openDeleteOptionModal(pollId, opt){
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <h3>Delete "${escapeHtml(opt.name)}"?</h3>
        <p>Removes this option and its votes. You can undo right after.</p>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-ghost" id="delopt-cancel" style="flex:1">Cancel</button>
          <button class="btn" id="delopt-confirm" style="flex:1;background:var(--rose);color:#fff;">Delete option</button>
        </div>
      </div>
    `;
    openModal(backdrop);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(backdrop); });
    backdrop.querySelector('#delopt-cancel').addEventListener('click', () => closeModal(backdrop));
    backdrop.querySelector('#delopt-confirm').addEventListener('click', async () => {
      const btn = backdrop.querySelector('#delopt-confirm');
      btn.disabled = true; btn.textContent = 'Deleting…';
      try {
        const { id, ...rest } = opt;
        await deleteDoc(doc(db, 'polls', pollId, 'options', id));
        closeModal(backdrop);
        showUndoBanner(`Deleted "${opt.name}"`, async () => {
          await setDoc(doc(db, 'polls', pollId, 'options', id), rest);
        });
      } catch (e) {
        toast(`Could not delete option: ${e.message || 'unknown error'}`);
        btn.disabled = false; btn.textContent = 'Delete option';
        console.error(e);
      }
    });
  }

  /* ---------- edit modal ---------- */
  function openEditModal(pollId, opt){
    const link = opt.link ?? opt.mapsUri ?? '';
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `

    backdrop.querySelector('#edit-save').addEventListener('click', async () => {

  /* ---------- auto-close scheduling modal ---------- */
  function openScheduleCloseModal(pollId, currentCloseAt){
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <h3>Auto-close voting</h3>
        <p>Voting closes by itself at this date and time (your device's local time). Leave it blank and save to remove the schedule.</p>
        <label class="field-label">Close date & time</label>
        <input id="closeat-input" type="datetime-local" class="field" value="${toDatetimeLocalValue(currentCloseAt)}" />
        <div style="display:flex;gap:10px;">
          <button class="btn btn-ghost" id="closeat-cancel" style="flex:1">Cancel</button>
          <button class="btn btn-primary" id="closeat-save" style="flex:1">${currentCloseAt ? 'Update' : 'Schedule'}</button>
        </div>
        ${currentCloseAt ? `<button class="btn btn-ghost" id="closeat-remove" style="width:100%;margin-top:10px;color:var(--rose);">Remove auto-close</button>` : ''}
      </div>
    `;
    openModal(backdrop);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(backdrop); });
    backdrop.querySelector('#closeat-cancel').addEventListener('click', () => closeModal(backdrop));
    backdrop.querySelector('#closeat-save').addEventListener('click', async () => {
      const val = document.getElementById('closeat-input').value;
      if (!val) { toast('Pick a date and time, or use Remove auto-close.'); return; }
      const chosen = new Date(val);
      if (isNaN(chosen.getTime())) { toast('That date/time looks invalid — please re-pick it.'); return; }
      if (chosen.getTime() <= Date.now()) { toast('Pick a time in the future.'); return; }
      const btn = backdrop.querySelector('#closeat-save');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        await updateDoc(doc(db, 'polls', pollId), { closeAt: chosen.toISOString() });
        closeModal(backdrop);
        toast('Auto-close scheduled');
      } catch (e) {
        toast(`Could not schedule auto-close: ${e.message || 'unknown error'}`);
        console.error(e);
        btn.disabled = false; btn.textContent = currentCloseAt ? 'Update' : 'Schedule';
      }
    });
    backdrop.querySelector('#closeat-remove')?.addEventListener('click', async () => {
      const btn = backdrop.querySelector('#closeat-remove');
      btn.disabled = true; btn.textContent = 'Removing…';
      try {
        await updateDoc(doc(db, 'polls', pollId), { closeAt: deleteField() });
        closeModal(backdrop);
        toast('Auto-close removed');
      } catch (e) {
        toast(`Could not remove auto-close: ${e.message || 'unknown error'}`);
        console.error(e);
        btn.disabled = false; btn.textContent = 'Remove auto-close';
      }
    });
  }

  /* ---------- auto-close watcher ----------
     Checks on every redraw and on a 30s interval so a poll left open in
     the background (nobody tapping anything) still closes on schedule for
     whoever has it open. Guarded so only one write is ever sent per poll
     per session, even if the check fires again before Firestore's update
     comes back through onSnapshot. */
  let autoCloseInFlight = false;
  function checkAutoClose(){
    if (!pollData || pollData.closed || !pollData.closeAt || autoCloseInFlight) return;
    if (new Date(pollData.closeAt).getTime() > Date.now()) return;
    autoCloseInFlight = true;
    updateDoc(pollRef, { closed: true }).catch((e) => {
      autoCloseInFlight = false;
      console.error('Auto-close failed:', e);
    });
  }
  const autoCloseTimer = setInterval(checkAutoClose, 30000);
  window.addEventListener('beforeunload', () => clearInterval(autoCloseTimer), { once: true });
}

function voteCount(opt){ return Object.keys(opt.votes || {}).length; }

/* ---------- copy results as image ----------
   Renders the current results into an offscreen canvas styled to match
   the app, then copies it to the clipboard as a PNG so it can be pasted
   straight into a WhatsApp chat. Falls back to a downloaded file on
   browsers/contexts where clipboard image-write isn't available (e.g.
   some in-app browsers), so the feature still works, just one tap slower. */
async function copyResultsAsImage(pollData, options){
  toast('Preparing image…');
  try {
    const blob = await renderResultsBlob(pollData, options);
    if (navigator.clipboard && window.ClipboardItem) {
      try {
        await navigator.clipboard.write([new window.ClipboardItem({ 'image/png': blob })]);
        toast('Results image copied — paste it into WhatsApp!');
        return;
      } catch (e) {
        console.error('Clipboard write failed, falling back to download:', e);
      }
    }
    downloadBlob(blob, `${slugify(pollData.title) || 'poll'}-results.png`);
    toast('Clipboard copy isn\u2019t available here — image downloaded instead.');
  } catch (e) {
    toast(`Could not create results image: ${e.message || 'unknown error'}`);
    console.error(e);
  }
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function renderResultsBlob(pollData, options){
  // Wait for the webfonts to be ready so canvas text doesn't fall back to
  // a generic serif/sans-serif — this only resolves once, near-instant if
  // the fonts already loaded when the page did.
  try { await document.fonts.ready; } catch {}

  const W = 640;
  const PAD = 28;
  const ROW_H = 64;
  const HEADER_H = 96;
  const FOOTER_H = 44;
  const rows = options.length || 1;
  const H = HEADER_H + rows * ROW_H + FOOTER_H + PAD;

  const canvas = document.createElement('canvas');
  const scale = 2; // render at 2x for crisp text on retina/phone screens
  canvas.width = W * scale; canvas.height = H * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  const bg = '#141319', surface = '#1E1C27', border = '#4E4768', text = '#F5F3FA',
        textMuted = '#A39DB8', violet = '#A594F5', violetDim = '#332C4D', gold = '#EFB65C';

  // background
  ctx.fillStyle = bg;
  roundRect(ctx, 0, 0, W, H, 0); ctx.fill();

  // header
  ctx.fillStyle = text;
  ctx.font = "600 22px Fraunces, serif";
  ctx.textBaseline = 'alphabetic';
  wrapText(ctx, pollData.title || 'Poll results', PAD, 40, W - PAD * 2, 26);

  const totalVotes = options.reduce((sum, o) => sum + voteCount(o), 0);
  ctx.fillStyle = textMuted;
  ctx.font = "500 13px Inter, sans-serif";
  ctx.fillText(`${pollData.closed ? 'Voting closed' : 'Voting open'} · ${totalVotes} vote${totalVotes===1?'':'s'} total`, PAD, 68);

  const topCount = options.length ? Math.max(...options.map(voteCount)) : 0;

  let y = HEADER_H;
  if (!options.length) {
    ctx.fillStyle = textMuted;
    ctx.font = "500 14px Inter, sans-serif";
    ctx.fillText('No options were added to this poll.', PAD, y + 34);
    y += ROW_H;
  }
  options.forEach((opt) => {
    const count = voteCount(opt);
    const pct = totalVotes ? count / totalVotes : 0;
    const isLeading = count > 0 && count === topCount;
    const rowY = y;
    const barMaxW = W - PAD * 2;

    // row background
    ctx.fillStyle = surface;
    roundRect(ctx, PAD, rowY + 6, barMaxW, ROW_H - 16, 12); ctx.fill();
    ctx.strokeStyle = border; ctx.lineWidth = 1;
    roundRect(ctx, PAD, rowY + 6, barMaxW, ROW_H - 16, 12); ctx.stroke();

    // progress fill
    const fillW = Math.max(0, Math.min(barMaxW, barMaxW * pct));
    if (fillW > 0) {
      ctx.save();
      roundRect(ctx, PAD, rowY + 6, barMaxW, ROW_H - 16, 12); ctx.clip();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = isLeading ? gold : violetDim;
      ctx.fillRect(PAD, rowY + 6, fillW, ROW_H - 16);
      ctx.restore();
    }

    // option name
    ctx.fillStyle = text;
    ctx.font = "600 15px Inter, sans-serif";
    const label = truncateToWidth(ctx, opt.name || '', barMaxW - 130);
    ctx.fillText(label, PAD + 16, rowY + ROW_H / 2 + 5);

    // count + pct, right aligned
    ctx.textAlign = 'right';
    ctx.fillStyle = isLeading ? gold : violet;
    ctx.font = "700 15px 'JetBrains Mono', monospace";
    ctx.fillText(`${count}`, W - PAD - 16, rowY + ROW_H / 2);
    ctx.fillStyle = textMuted;
    ctx.font = "500 11px Inter, sans-serif";
    ctx.fillText(`${Math.round(pct * 100)}%`, W - PAD - 16, rowY + ROW_H / 2 + 16);
    ctx.textAlign = 'left';

    y += ROW_H;
  });

  // footer credit
  ctx.fillStyle = textMuted;
  ctx.font = "500 11px Inter, sans-serif";
  ctx.textAlign = 'center';
  ctx.fillText('Made with YouVote · By YE Chew', W / 2, H - 16);
  ctx.textAlign = 'left';

  return new Promise((resolve, reject) => {
    canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('Canvas produced no image data')), 'image/png');
  });
}

function roundRect(ctx, x, y, w, h, r){
  if (r === 0) { ctx.beginPath(); ctx.rect(x, y, w, h); return; }
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}
function wrapText(ctx, str, x, y, maxWidth, lineHeight){
  const words = (str || '').split(' ');
  let line = '', lineY = y;
  for (let i = 0; i < words.length; i++) {
    const test = line ? line + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxWidth && line) {
      ctx.fillText(line, x, lineY);
      line = words[i]; lineY += lineHeight;
    } else {
      line = test;
    }
  }
  if (line) ctx.fillText(line, x, lineY);
}
function truncateToWidth(ctx, str, maxWidth){
  if (ctx.measureText(str).width <= maxWidth) return str;
  let s = str;
  while (s.length > 1 && ctx.measureText(s + '…').width > maxWidth) s = s.slice(0, -1);
  return s + '…';
}

function optionCardHtml(opt, voter, totalVotes, isLeading, expanded){
  const count = voteCount(opt);
  const pct = totalVotes ? Math.round((count / totalVotes) * 100) : 0;
  const voterKey = voter ? voter.id : null;
  const hasVoted = !!(voterKey && opt.votes && opt.votes[voterKey]);
  const voterEntries = Object.entries(opt.votes || {});
  const link = opt.link ?? opt.mapsUri ?? null;
  const barColor = isLeading && count > 0 ? 'var(--gold)' : 'var(--violet-dim)';

  return `
    <div class="option-card" data-option-id="${opt.id}">
      <div class="option-row" data-vote-row="${opt.id}" role="button" tabindex="0" aria-pressed="${hasVoted}" aria-label="Vote for ${escapeHtml(opt.name)}">
        <div class="opt-progress-bg" style="width:${pct}%;background:${barColor};"></div>
        <div class="opt-row-content">
          <div class="vote-btn ${hasVoted ? 'checked' : ''}" aria-hidden="true">${hasVoted ? '✓ Voted' : 'Vote'}</div>
          <div class="opt-row-text"><div class="opt-title">${escapeHtml(opt.name)}</div></div>
          <div class="opt-count num">${count}</div>
          <button class="opt-chevron ${expanded ? 'open' : ''}" data-toggle-expand="${opt.id}" aria-label="${expanded ? 'Hide' : 'Show'} details for ${escapeHtml(opt.name)}" aria-expanded="${expanded}">▾</button>
        </div>
      </div>
      ${expanded ? `
        <div class="option-detail">
          ${opt.notes ? `<div class="option-notes">${escapeHtml(opt.notes)}</div>` : ''}
          ${link ? `<div class="option-sub"><a class="link-chip" href="${escapeHtml(link)}" target="_blank" rel="noopener">Reference link ↗</a></div>` : ''}
          <div class="option-bottom">
            <div class="voter-tokens">
              ${voterEntries.map(([id, v]) => {
                const c = getPersonColor(id);
                return `<div class="voter-token" title="${escapeHtml(v.name)}" style="background:${c}22;border-color:${c};color:${c};">${escapeHtml(v.initials)}</div>`;
              }).join('')}
              <span class="vote-count-label">${count ? count + ' vote' + (count===1?'':'s') + (totalVotes ? ' · ' + pct + '%' : '') : 'No votes yet'}</span>
            </div>
            <button class="chip chip-icon-only" data-edit="${opt.id}" title="Edit this option">✏️</button>
          </div>
        </div>
      ` : ''}
    </div>
  `;
}

function calendarPickerHtml(calState){
  const { month, selected } = calState;
  const year = month.getFullYear(), m = month.getMonth();
  const first = new Date(year, m, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, m + 1, 0).getDate();
  const todayISO = new Date().toISOString().slice(0, 10);
  const monthLabel = `${MONTHS[m]} ${year}`;

  let cells = '';
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const iso = `${year}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isPast = iso < todayISO;
    const isSelected = selected.has(iso);
    cells += `<button class="cal-cell ${isSelected ? 'selected' : ''} ${isPast ? 'past' : ''}" data-cal-day="${iso}" ${isPast ? 'disabled' : ''}>${day}</button>`;
  }

  return `
    <div class="cal-header">
      <button class="chip chip-icon-only" id="cal-prev" aria-label="Previous month">‹</button>
      <span class="cal-month">${monthLabel}</span>
      <button class="chip chip-icon-only" id="cal-next" aria-label="Next month">›</button>
    </div>
    <div class="cal-weekdays"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div>
    <div class="cal-grid">${cells}</div>
    <button id="add-dates-btn" class="btn btn-primary" ${selected.size === 0 ? 'disabled' : ''}>
      Add ${selected.size || ''} date${selected.size === 1 ? '' : 's'}
    </button>
  `;
}

/* ---------- delete poll modal (home page, with undo) ---------- */
function openDeletePollModal(pollId, title){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>Delete "${escapeHtml(title)}"?</h3>
      <p>This removes the poll and every vote for everyone. You can undo right after.</p>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-ghost" id="delete-cancel" style="flex:1">Cancel</button>
        <button class="btn" id="delete-confirm" style="flex:1;background:var(--rose);color:#fff;">Delete poll</button>
      </div>
    </div>
  `;
  openModal(backdrop);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(backdrop); });
  backdrop.querySelector('#delete-cancel').addEventListener('click', () => closeModal(backdrop));
  backdrop.querySelector('#delete-confirm').addEventListener('click', async () => {
    const btn = backdrop.querySelector('#delete-confirm');
    btn.disabled = true; btn.textContent = 'Deleting…';
    try {
      const pollSnap = await getDoc(doc(db, 'polls', pollId));
      const savedPollData = pollSnap.exists() ? pollSnap.data() : { title, createdAt: serverTimestamp(), closed: false, multiChoice: false };
      const optsSnap = await getDocs(collection(db, 'polls', pollId, 'options'));
      const savedOptions = optsSnap.docs.map(d => ({ id: d.id, data: d.data() }));

      await Promise.all(optsSnap.docs.map(d => deleteDoc(d.ref)));
      await deleteDoc(doc(db, 'polls', pollId));
      removeRecent(pollId);

      closeModal(backdrop);
      showUndoBanner(`Deleted "${title}"`, async () => {
        await setDoc(doc(db, 'polls', pollId), savedPollData);
        await Promise.all(savedOptions.map(o => setDoc(doc(db, 'polls', pollId, 'options', o.id), o.data)));
        addRecent(pollId, savedPollData.title || title);
        renderHome();
      });
      renderHome();
    } catch (e) {
      toast(`Could not delete poll: ${e.message || 'unknown error'}`);
      btn.disabled = false; btn.textContent = 'Delete poll';
      console.error(e);
    }
  });
}

async function castVote(pollId, options, optId, multiChoice){
  const voter = getVoter();
  const voterKey = voter.id;
  const target = options.find(o => o.id === optId);
  const alreadyVoted = target?.votes?.[voterKey];

  if (multiChoice) {
    await updateDoc(doc(db, 'polls', pollId, 'options', optId), {
      [`votes.${voterKey}`]: alreadyVoted ? deleteField() : { name: voter.name, initials: voter.initials }
    });
    return;
  }

  const updates = options.map(async (opt) => {
    const has = opt.votes && opt.votes[voterKey];
    if (opt.id === optId) {
      return updateDoc(doc(db, 'polls', pollId, 'options', opt.id), {
        [`votes.${voterKey}`]: alreadyVoted ? deleteField() : { name: voter.name, initials: voter.initials }
      });
    } else if (has) {
      return updateDoc(doc(db, 'polls', pollId, 'options', opt.id), { [`votes.${voterKey}`]: deleteField() });
    }
  });
  await Promise.all(updates);
}

/* ---------- voter name prompt ---------- */
function askVoterName(onDone){
  const existing = getVoter();
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>${existing ? 'Edit your name' : "What's your name?"}</h3>
      <p>Shown next to your vote so friends know who picked what. Saved on this device only.${existing ? ' Renaming keeps all your existing votes — it just relabels them.' : ''}</p>
      <input id="voter-name-input" class="field" placeholder="e.g. Pikachew" maxlength="20" value="${existing ? escapeHtml(existing.name) : ''}" />
      <button class="btn btn-primary" id="voter-name-save">${existing ? 'Save' : 'Continue'}</button>
    </div>
  `;
  openModal(backdrop);
  const input = backdrop.querySelector('#voter-name-input');
  input.focus();
  if (existing) input.select();
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(backdrop); });
  backdrop.querySelector('#voter-name-save').addEventListener('click', () => {
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    const voter = setVoter(name);
    closeModal(backdrop);
    if (onDone) onDone(voter);
  });
}
